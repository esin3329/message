<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>게임 공지 및 업데이트 알림</title>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>게임 공지 및 업데이트</h1>
            <p>최신 공지사항을 확인하세요.</p>
        </div>

        <div class="alert" id="alert">새로운 공지사항이 있습니다! 페이지를 새로고침하세요.</div>

        <div class="notice" id="notice">
            <h2>공지사항 제목</h2>
            <p>공지사항 내용이 여기에 표시됩니다.</p>
        </div>
    </div>

    <script>
        // 예제 공지사항 데이터 - 실제로는 서버에서 데이터 요청 필요
        const latestNotice = {
            title: "환영합니다! 신규 이벤트 시작 안내",
            content: "이번 이벤트 기간 동안 특별한 보상을 받을 수 있습니다! 자세한 내용은 게임 내 공지사항을 참고하세요.",
            timestamp: "2024-11-05T10:00:00" // 예시 날짜 및 시간
        };

        // 현재 표시 중인 공지사항의 타임스탬프
        let currentNoticeTimestamp = latestNotice.timestamp;

        // 공지사항을 화면에 표시하는 함수
        function displayNotice(notice) {
            document.getElementById('notice').querySelector('h2').innerText = notice.title;
            document.getElementById('notice').querySelector('p').innerText = notice.content;
        }

        // 초기 공지사항 표시
        displayNotice(latestNotice);

        // 새 공지사항 확인 및 알림 표시
        function checkForNewNotice() {
            // 여기서는 AJAX 요청을 통해 서버에서 최신 공지사항 데이터를 가져오는 방식으로 변경 가능
            // 예시로 새로운 공지사항이 업데이트된 경우를 가정
            const newNotice = {
                title: "긴급 서버 점검 안내",
                content: "오늘 밤 11시부터 3시간 동안 서버 점검이 진행됩니다. 점검 중에는 접속이 제한됩니다.",
                timestamp: "2024-11-05T12:00:00" // 예시 타임스탬프 업데이트
            };

            // 새로운 공지사항이 있는지 확인 (타임스탬프 비교)
            if (newNotice.timestamp !== currentNoticeTimestamp) {
                // 새 공지가 있으면 알림 표시
                document.getElementById('alert').style.display = 'block';
                // 새로운 공지로 업데이트
                currentNoticeTimestamp = newNotice.timestamp;
                displayNotice(newNotice);
            }
        }

        // 1분마다 공지사항 업데이트 확인 (1000ms * 60 = 1분)
        setInterval(checkForNewNotice, 60000);
    </script>
</body>
</html>
