<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게임 이벤트 공지 및 업데이트 알림 시스템</title>
</head>
<body>
<div class="container">
    <h1>게임 이벤트 공지 및 업데이트</h1>
    <div id="announcements"></div>
    <div id="notification" class="notification">새로운 공지가 있습니다!</div>
</div>

<script>
    const announcementsContainer = document.getElementById('announcements');
    const notification = document.getElementById('notification');

    // 공지사항 데이터를 가져오는 함수
    async function fetchAnnouncements() {
        try {
            const response = await fetch('/api/announcements'); // 서버의 공지사항 API에서 데이터 가져오기
            const announcements = await response.json();

            announcementsContainer.innerHTML = ''; // 기존 내용 비우기

            announcements.forEach(announcement => {
                const announcementDiv = document.createElement('div');
                announcementDiv.classList.add('announcement');

                const title = document.createElement('div');
                title.classList.add('announcement-title');
                title.textContent = announcement.title;

                const content = document.createElement('div');
                content.classList.add('announcement-content');
                content.textContent = announcement.content;

                announcementDiv.appendChild(title);
                announcementDiv.appendChild(content);
                announcementsContainer.appendChild(announcementDiv);
            });
        } catch (error) {
            console.error('공지사항을 가져오는 중 오류 발생:', error);
        }
    }

    // 일정 간격마다 새 공지가 있는지 확인
    function checkForNewAnnouncements() {
        setInterval(async () => {
            try {
                const response = await fetch('/api/check-new-announcements'); // 새 공지가 있는지 확인
                const hasNewAnnouncement = await response.json();

                if (hasNewAnnouncement) {
                    notification.style.display = 'block'; // 알림 표시
                    await fetchAnnouncements(); // 새로운 공지 목록 가져오기
                } else {
                    notification.style.display = 'none';
                }
            } catch (error) {
                console.error('새 공지 확인 중 오류 발생:', error);
            }
        }, 60000); // 1분마다 확인
    }

    // 페이지 로드 시 초기 공지사항 로드 및 새 공지 확인 시작
    document.addEventListener('DOMContentLoaded', () => {
        fetchAnnouncements();
        checkForNewAnnouncements();
    });
</script>

</body>
</html>
